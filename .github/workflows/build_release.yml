# KomaScroll: release builder (replaces Komikku's, which signed with Komikku's own secrets).
#
# Pushing a tag such as v1.0.0 builds signed release APKs (R8 shrinking on) and attaches them to a
# draft GitHub release for you to review and publish. It can also be run by hand from the Actions
# tab. Signing uses four repository secrets (see README → Signing a release):
#   KOMASCROLL_KEYSTORE_BASE64, KOMASCROLL_KEYSTORE_PASSWORD, KOMASCROLL_KEY_ALIAS, KOMASCROLL_KEY_PASSWORD
# Without them the APKs are built unsigned and no release is created.
name: Release Builder

on:
  push:
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Clone repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KOMASCROLL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/komascroll-release.jks"
            echo "KOMASCROLL_KEYSTORE_FILE=$RUNNER_TEMP/komascroll-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets are not set, so the release APKs will be unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Build release APKs
        env:
          KOMASCROLL_KEYSTORE_PASSWORD: ${{ secrets.KOMASCROLL_KEYSTORE_PASSWORD }}
          KOMASCROLL_KEY_ALIAS: ${{ secrets.KOMASCROLL_KEY_ALIAS }}
          KOMASCROLL_KEY_PASSWORD: ${{ secrets.KOMASCROLL_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Name APKs
        run: |
          set -e
          version=$(echo "$GITHUB_REF_NAME" | tr '/' '-')
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" .apk | sed -e 's/^app-//' -e 's/-release.*$//')
            cp "$apk" "dist/KomaScroll-${version}-${abi}.apk"
          done
          ls -l dist

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/komascroll-release.jks"

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KomaScroll-release-${{ github.sha }}
          path: dist/*.apk

      - name: Upload R8 mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          name: KomaScroll ${{ github.ref_name }}
          body: |
            KomaScroll ${{ github.ref_name }}, an Android manga reader based on Komikku.

            If you are unsure which file to download, take `KomaScroll-${{ github.ref_name }}-universal.apk`.
            Most current phones can use the smaller `arm64-v8a` one.
          files: dist/*.apk
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
